{# Menyudagi bitta taom kartasi. Kategoriya bo'limlarida ham, "Bugungi taklif"da ham. #}
{% import "partials/icons.html" as ui %}
{#
  Qo'shish tugmasi havolaning ICHIDA emas, yonida turadi: `<button>` ni `<a>`
  ichiga qo'yish HTML qoidasiga ham, klaviatura bilan yurishga ham to'g'ri
  kelmaydi. Shuning uchun ikkalasi bitta o'ram ichida yonma-yon.
#}
<div class="dish-wrap">
  <a class="dish" href="/r/{{ restaurant.slug }}/item/{{ item.id }}{{ '?lang=' ~ lang if lang != 'uz' }}">
    <div class="dish-media">
      {% if item.image %}
        <img src="/media/{{ item.image }}" alt="{{ tr(item.name, lang) }}" loading="lazy" decoding="async">
      {% else %}
        <div class="dish-ph">{{ ui.icon('plate') }}</div>
      {% endif %}
      {#
        Narx va vaqt bitta qatorda. Ilgari ikkalasi alohida absolyut joylashgan
        edi va telefonda tor kartada bir-birining ustiga chiqib ketardi —
        "100 000 so'm" ustiga "60 min" tushib, narx o'qilmay qolardi.
      #}
      <span class="dish-meta">
        <span class="price-pill">{{ item.price | price }} <small>{{ restaurant.currency }}</small></span>
        {% if item.prep_minutes %}
          <span class="time-pill">{{ ui.icon('clock') }}{{ item.prep_minutes }} {{ t('min', lang) }}</span>
        {% endif %}
      </span>
      {% if item.is_popular %}<span class="dish-tag">{{ t('popular', lang) }}</span>{% endif %}
    </div>
    <div class="dish-body">
      <p class="dish-name clamp-2">{{ tr(item.name, lang) }}</p>
      {% set note = tr(item.description, lang) %}
      {% if note %}<p class="dish-desc clamp-2">{{ note }}</p>{% endif %}
      {% include "public/_dish_marks.html" %}
    </div>
  </a>

  {% if can_order %}
    <button class="dish-add" type="button"
            data-id="{{ item.id }}"
            data-name="{{ tr(item.name, lang) }}"
            data-price="{{ item.price | int }}"
            aria-label="{{ t('order_add', lang) }}: {{ tr(item.name, lang) }}">+</button>
  {% endif %}
</div>
